name: Imperialis Vita QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run 6-Gate ESM QA Suite
        run: node scripts/qa.mjs

      - name: Run Red-Team Health & Fuzz Check (100 lives)
        run: node scripts/audit-health.mjs --lives=100

      - name: Run TypeScript Typecheck (astro sync + tsc)
        run: npm run typecheck

      - name: Run React Behavioral Accessibility Tests
        run: npm test

      - name: Run Astro Static Production Build & Gate 8 Bundle Isolation Check
        run: npm run build && node scripts/qa.mjs --only-dist
